<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Step 5: the return arrow</title>
  <desc id="d">The same two circles, Hydrosphere and Atmosphere, now joined by two arrows pointing opposite ways: evaporates into runs along the top from hydrosphere to atmosphere, and rains onto runs along the bottom from atmosphere back to hydrosphere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e5395"/>
    </marker>
  </defs>
  <rect width="640" height="220" fill="#ffffff"/>
  <g fill="none" stroke="#2e5395" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M206 92 Q320 40 434 92"/>
    <path d="M434 128 Q320 180 206 128"/>
  </g>
  <g font-size="14" fill="#1a1a2e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <text x="320" y="58">evaporates into</text>
    <text x="320" y="176">rains onto</text>
  </g>
  <g stroke="#1a1a2e" stroke-width="2">
    <circle cx="150" cy="110" r="56" fill="#d9e2f3"/>
    <circle cx="490" cy="110" r="56" fill="#d9e7f3"/>
  </g>
  <g text-anchor="middle" fill="#1a1a2e">
    <text x="150" y="107" font-size="16" font-weight="700">Hydrosphere</text>
    <text x="150" y="126" font-size="12" fill="#4f4f4f">water</text>
    <text x="490" y="107" font-size="16" font-weight="700">Atmosphere</text>
    <text x="490" y="126" font-size="12" fill="#4f4f4f">air</text>
  </g>
  <text x="320" y="206" font-size="12" fill="#4f4f4f" text-anchor="middle">Two arrows, opposite ways. That is a loop.</text>
</svg>
