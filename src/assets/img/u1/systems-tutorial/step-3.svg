<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Step 3: one sentence on paper</title>
  <desc id="d">A single handwritten sentence on ruled paper: Hydrosphere evaporates into atmosphere. Under it, three small labels mark the shape of the sentence: sphere, verb, sphere.</desc>
  <rect width="640" height="160" fill="#ffffff"/>
  <g stroke="#e3e1da" stroke-width="1.5">
    <line x1="40" y1="60" x2="600" y2="60"/>
    <line x1="40" y1="100" x2="600" y2="100"/>
    <line x1="40" y1="140" x2="600" y2="140"/>
  </g>
  <text x="60" y="54" font-size="24" fill="#1a1a2e"><tspan font-weight="700">Hydrosphere</tspan> <tspan fill="#2e5395" font-style="italic">evaporates into</tspan> <tspan font-weight="700">atmosphere</tspan>.</text>
  <g font-size="12" fill="#4f4f4f">
    <text x="60" y="84">[sphere]</text>
    <text x="236" y="84" fill="#2e5395">[verb]</text>
    <text x="407" y="84">[sphere]</text>
  </g>
</svg>
