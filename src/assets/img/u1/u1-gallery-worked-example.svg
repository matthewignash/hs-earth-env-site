<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A finished gallery card: Arctic ice and sunlight</title>
  <desc id="d">Left: a drawing with three labeled circles. Hydrosphere (sea ice) and Atmosphere at the top are joined by two arrows, reflects sunlight back into and warms, with a dashed loop marker carrying a plus sign between them. Biosphere sits below, joined from Hydrosphere by an arrow labeled shelters. Under the drawing is the sentence: I pushed melting up, and it came back bigger, because dark open water absorbs the sunlight the ice used to reflect, so the air warms and more ice melts. Right: the same four numbered lines written out as the filled-in note frame, and the numbers 1 to 4 on the drawing show where each line went.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e5395"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b34a2e"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a1a2e">Card 7 drawn: Arctic ice and sunlight</text>
  <text x="24" y="50" font-size="12" fill="#4f4f4f">The numbers on the drawing are the four lines of the note frame.</text>

  <g fill="none" stroke="#2e5395" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M206 152 Q320 100 434 152"/>
    <path d="M434 188 Q320 240 206 188"/>
    <path d="M150 226 L150 322"/>
  </g>
  <g fill="none" stroke="#b34a2e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#loop-arrow)">
    <path d="M304 156 A18 18 0 1 1 304 184"/>
  </g>
  <text x="320" y="176" font-size="18" font-weight="700" fill="#b34a2e" text-anchor="middle">+</text>

  <g font-size="13" fill="#1a1a2e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <text x="320" y="118">reflects sunlight back into</text>
    <text x="320" y="246">warms</text>
    <text x="196" y="280">shelters</text>
  </g>

  <g stroke="#1a1a2e" stroke-width="2">
    <circle cx="150" cy="170" r="56" fill="#d9e2f3"/>
    <circle cx="490" cy="170" r="56" fill="#d9e7f3"/>
    <circle cx="150" cy="380" r="56" fill="#e2efda"/>
  </g>
  <g text-anchor="middle" fill="#1a1a2e">
    <text x="150" y="167" font-size="15" font-weight="700">Hydrosphere</text>
    <text x="150" y="186" font-size="12" fill="#4f4f4f">sea ice</text>
    <text x="490" y="167" font-size="15" font-weight="700">Atmosphere</text>
    <text x="490" y="186" font-size="12" fill="#4f4f4f">air</text>
    <text x="150" y="377" font-size="15" font-weight="700">Biosphere</text>
    <text x="150" y="396" font-size="12" fill="#4f4f4f">seals, plankton</text>
  </g>

  <g id="badges" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="320" cy="90" r="11" fill="#2e5395"/><text x="320" y="95">1</text>
    <circle cx="320" cy="268" r="11" fill="#2e5395"/><text x="320" y="273">2</text>
    <circle cx="352" cy="146" r="11" fill="#b34a2e"/><text x="352" y="151">3</text>
    <circle cx="116" cy="276" r="11" fill="#2e5395"/><text x="116" y="281">4</text>
  </g>

  <rect x="230" y="320" width="300" height="120" rx="10" fill="#fff4d9" stroke="#cccccc" stroke-width="1.5"/>
  <circle cx="248" cy="338" r="11" fill="#b34a2e"/><text x="248" y="343" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <g font-size="12" fill="#1a1a2e">
    <text x="266" y="343">"I pushed melting up, and it came back</text>
    <text x="246" y="362">bigger, because dark open water absorbs the</text>
    <text x="246" y="380">sunlight the ice used to reflect, so the air</text>
    <text x="246" y="398">warms and more ice melts."</text>
    <text x="246" y="424" font-weight="700" fill="#b34a2e">Sign: +</text>
  </g>

  <g id="frame">
    <rect x="570" y="70" width="326" height="376" rx="10" fill="#fafaf7" stroke="#cccccc" stroke-width="1.5"/>
    <text x="586" y="94" font-size="11" font-weight="700" fill="#2e5395" letter-spacing="0.5">NOTE FRAME, FILLED IN</text>
    <g font-size="12" fill="#1a1a2e">
      <circle cx="597" cy="118" r="10" fill="#2e5395"/><text x="597" y="122" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="614" y="116" font-size="11" font-weight="700" fill="#4f4f4f">First arrow, written for you</text>
      <text x="614" y="134">Hydrosphere reflects sunlight back into</text>
      <text x="614" y="150">atmosphere.</text>

      <circle cx="597" cy="182" r="10" fill="#2e5395"/><text x="597" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="614" y="180" font-size="11" font-weight="700" fill="#4f4f4f">Return arrow, your verb</text>
      <text x="614" y="198">Atmosphere <tspan font-weight="700">warms</tspan> hydrosphere.</text>

      <circle cx="597" cy="230" r="10" fill="#b34a2e"/><text x="597" y="234" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="614" y="228" font-size="11" font-weight="700" fill="#4f4f4f">Sign test, your words</text>
      <text x="614" y="246">I pushed <tspan font-weight="700">melting</tspan> up, and it came back</text>
      <text x="614" y="262"><tspan font-weight="700">bigger</tspan>, because <tspan font-weight="700">dark open water absorbs</tspan></text>
      <text x="614" y="278"><tspan font-weight="700">the sunlight the ice used to reflect, so the</tspan></text>
      <text x="614" y="294"><tspan font-weight="700">air warms and more ice melts</tspan>. Sign: <tspan font-weight="700" fill="#b34a2e">+</tspan></text>

      <circle cx="597" cy="332" r="10" fill="#2e5395"/><text x="597" y="336" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="614" y="330" font-size="11" font-weight="700" fill="#4f4f4f">Next sphere, your verb</text>
      <text x="614" y="348">Biosphere joins by <tspan font-weight="700">shelters</tspan>: the ice</text>
      <text x="614" y="364">shelters seals and plankton.</text>

      <text x="586" y="404" font-size="11" fill="#4f4f4f">Bold is what the student wrote. Everything</text>
      <text x="586" y="420" font-size="11" fill="#4f4f4f">else was already on the card.</text>
    </g>
  </g>
</svg>
